// CS2 - stabil autoexec utan Null Binds / Snap Tap
// Ersatt trasig buyfix och rostade movement-alias med vanliga tangenter.

// Stoppa eventuell kvarhangande rorelse fran tidigare CFG.
-forward
-back
-left
-right
forwardback 0 0 0
rightleft 0 0 0

// Standardrorelse: fungerar aven med kopmenyn.
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "b" "buymenu"
bind "ESCAPE" "cancelselect"

// Rensa de extra F8/F9-bindningarna fran gamla buyfix.
unbind "F8"
unbind "F9"

// Aterstall musstyrningen efter VoidCFG.
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
m_yaw 0.022
sensitivity_y_scale 1

// Avaktivera VoidCFG:s mouse4/mouse5-trick, som kan andra musaxlar.
unbind "MOUSE4"
unbind "MOUSE5"

// Ditt befintliga crosshair vid skott, oforandrat.
alias "+shootcrosshair" "+attack; cl_crosshair_recoil 1; cl_crosshairstyle 7"
alias "-shootcrosshair" "-attack; cl_crosshair_recoil 0; cl_crosshairstyle 4"
bind "MOUSE1" "+shootcrosshair"
cl_crosshair_recoil 0
cl_crosshairstyle 4

// Scrollhjul = hopp (fran din tidigare CFG).
bind "MWHEELDOWN" "+jump"
bind "MWHEELUP" "+jump"

echo "[CFG] Stabil autoexec laddad: vanlig WASD + crosshair vid skott"
